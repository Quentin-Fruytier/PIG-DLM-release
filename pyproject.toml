[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-dlm"
version = "0.1.0"
license = {text = "MIT"}
description = "Parallel Inconsistency Guidance (PIG): parallel decoding for diffusion language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers",
    "safetensors",
    "huggingface_hub",
]

[project.optional-dependencies]
experiments = ["datasets", "matplotlib"]      # the benchmark harness in experiments/
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
